# English, the source language. Every other locales/<lang>.yml translates these keys.
# See locales/README.md before translating. Values are double-quoted so that leading spaces,
# colons and backticks survive; %{name} is a placeholder and must appear in every translation.
_version: 1

cli:
  about: "Claude Code Notifier: get a push on your phone when Claude Code needs you, and answer from there"
  pair:
    about: "Pair this computer with your phone. Pass the code the app shows, or run with no code to get one to type into the app"
    code: "The 6-digit code shown in the Claude Code Notifier app"
    name: "What this computer is called on your phone (default: the hostname)"
    replace_mac_app: "Also remove the Mac menu bar app's hook entries, so notifications are not sent twice"
    no_wait: "Show the QR code and return at once: pairing completes on its own when the phone connects"
  setup:
    about: "Install the Claude Code hooks and desktop notifications (pair and bare ccn do this first)"
    replace_mac_app: "Also remove the Mac menu bar app's hook entries"
  doctor:
    about: "Check hooks, credentials, the server and what this terminal supports"
  test:
    about: "Send a test notification to every paired phone"
  devices:
    about: "List paired phones, or revoke one"
    revoke: "Revoke a paired phone by name or id"
  config:
    about: "Show or change this computer's settings (also editable from the phone)"
    show: "Print the effective settings"
    set: "Set one setting, e.g. `ccn config set hold_ceiling_seconds 300` or `ccn config set quiet_hours 22:00-08:00`"
  sync:
    about: "Pull the latest settings from the server now"
  unlock:
    about: "Buy a licence for this computer in the browser: unlocks every phone paired with it"
    lifetime: "Pay once instead of yearly (or switch an annual licence to lifetime, keeping the key)"
  upgrade:
    about: "Update ccn to the latest release (checked once a day in the background too)"
    check: "Only say whether a newer release exists: exit 0 when up to date, 10 when one is available"
    quiet: "Print nothing unless something went wrong"
  activate:
    about: "Use a licence key on this computer (up to 3 computers per licence)"
    key: "The key from your email, CCN-XXXX-XXXX-XXXX-XXXX"
    replace: "Free the slot of another computer on the licence, by its name, to make room for this one"
  deactivate:
    about: "Free this computer's licence slot so the key can be used elsewhere"
  licence:
    about: "Show this computer's licence and the computers using it"
  uninstall:
    about: "Remove the hooks, credentials, pairings and local state"
  forget:
    about: "Erase this computer and its pairings from the server, then uninstall"
    yes: "Don't ask for confirmation"

common:
  your_phone: "your phone"
  not_paired: "this computer is not paired yet. Run `ccn pair <code>` with the code from the app."
  store_keychain: "keychain"
  store_file: "file"
  # chrono strftime format for dates in sentences (renews, last seen). chrono only knows English
  # month names, so a translation should use a numeric form such as "%d.%m.%Y" or "%Y-%m-%d".
  date_format: "%-d %b %Y"

pair:
  reregister: "This computer's old pairing has been removed, so it will be registered again."
  code_not_recognised: "That code wasn't recognised. The 6-digit code is in the Claude Code Notifier app under Computers > Add a computer; it changes every 24 hours, so copy the line the app shows right now."
  offer_qr: "Press Enter to show a QR code here instead (scan it with your phone), or Ctrl+C."
  options_without_terminal: "Run `ccn pair <code>` again with the code the app shows now, or run `ccn pair` to show a QR code here and scan it with your phone."
  scan: "  Scan this with your phone's camera to connect it. Without the app yet, it\n  takes you to the App Store or Google Play: install, then scan again."
  or_type_code: "  Or type this code in the Claude Code Notifier app:  %{code}"
  enter_code: "  Enter this code in the Claude Code Notifier app:  %{code}"
  hooks_already_installed: "  Hooks are installed, so you already get desktop notifications on this computer."
  code_lasts: "  Pair when you like: this code lasts %{duration}."
  completes_on_its_own: "  Pairing completes on its own when the phone connects."
  waiting: "  Waiting for your phone... (Ctrl+C is safe: pairing completes on its own when the phone connects)"
  code_expired: "the code expired before a phone claimed it. Run `ccn pair` again."
  code_is_six_digits: "the code is the 6 digits shown in the Claude Code Notifier app"
  credentials_stored: "Credentials stored in the %{store} (%{path})."
  test_sent: "Sent a test notification to your phone."
  test_failed: "Could not send a test notification yet: %{error}"
  done: "Done. Start `claude` as usual: you will get a push when Claude finishes or needs you,\nand you can approve, deny or answer from the phone. `ccn doctor` checks everything."
  paired_with: "Paired with %{name} (%{platform})."
  hours_one: "1 hour"
  hours_other: "%{count} hours"
  minutes_one: "1 minute"
  minutes_other: "%{count} minutes"
  pitch: "Your phone will offer a subscription in the app. You can also unlock everything from here, outside the app stores:"
  pitch_annual: "  ccn unlock             %{price} a year"
  pitch_lifetime: "  ccn unlock --lifetime  %{price} once"
  pitch_covers: "Covers %{computers} computers and every phone paired with them. %{days}-day money-back."
  welcome_no_terminal: "A test notification is on its way to your phone: try answering it there."
  welcome: "A test notification is on its way to your phone. Try answering it there..."
  welcome_skip: "(press Enter to skip)"
  welcome_answered: "✓ Your phone answered \"%{answer}\". That is how you'll answer Claude."
  welcome_no_answer: "No answer yet. The notification stays on your phone for an hour."

status:
  set_up: "ccn %{version} is set up on this computer as \"%{name}\"."
  licence: "Licence: %{line}"
  hint_doctor: "  ccn doctor     check hooks, credentials and the server"
  hint_test: "  ccn test       send a test notification to your phone"
  hint_pair: "  ccn pair       pair another phone"
  hint_help: "  ccn --help     everything else"

setup:
  installed_self: "Installed ccn to %{path}."
  hooks_installed: "Hooks installed in %{path} (using %{exe})."
  mac_app_note: "Note: the Claude Code Notifier Mac app's hooks are also installed, so each event\nwould be sent twice. Run `ccn setup --replace-mac-app` to remove them, or quit the Mac app."
  mac_app_removed: "Removed the Mac app's hook entries; ccn handles notifications from now on."

sync:
  not_synced: "Settings not synced yet: %{error}"
  synced: "Settings synced."

doctor:
  header: "ccn %{version} on %{platform}"
  config: "config: %{path}"
  credentials_present: "credentials: present (%{store})"
  credentials_missing: "credentials: missing: run `ccn pair <code>`"
  server_reachable: "server: %{url} reachable"
  server_error: "server: %{error}"
  registered: "registered as \"%{name}\" (%{kind} %{platform}), capabilities: %{capabilities}"
  not_paired_any_more: "pairing: not paired any more: run `ccn pair`"
  registration_error: "registration: %{error}"
  licence: "licence: %{line}"
  phones_none: "phones: none paired yet, so notifications stay on this desktop (run `ccn pair`)"
  phones: "phones: %{names}"
  phones_error: "phones: %{error}"
  hooks_all: "hooks: all %{count} installed in %{path}"
  hooks_missing: "hooks: missing %{names} (run `ccn setup`)"
  hooks_error: "hooks: %{error}"
  hooks_stale: "hooks point at a different ccn binary; run `ccn setup` to update them"
  mac_app_hooks: "the Mac app's hooks are also installed (run `ccn setup --replace-mac-app`)"
  presence: "presence: idle %{idle}s now, threshold %{threshold}s"
  presence_none: "presence: not detectable here, so every request waits for the phone"
  replies: "replies: approvals and question answers from the phone work in any terminal; free text into an idle session %{free_text}"
  replies_tmux: "works (tmux)"
  replies_no_tmux: "needs tmux"
  desktop: "desktop notifications: %{line}"
  log: "log: %{path}"

test:
  none_paired: "no phones are paired. Run `ccn pair <code>`."
  sent: "Sent a test notification to %{name} (%{platform})."
  failed: "%{name}: %{error}"

devices:
  none: "No phones paired. Run `ccn pair <code>` with the code from the app."
  # %{name} is padded to 24 columns and %{platform} to 8 before they are filled in
  row: "%{name} %{platform} paired %{since}%{off}"
  notifications_off: "  (notifications off)"
  revoked: "Revoked %{name}."
  no_such_phone: "no paired phone called '%{device}'"

config:
  local_only: "(local only)"
  last_changed: "(last changed %{when}; also editable from the phone)"
  credentials_moved: "Credentials are now in the %{store}."
  credential_store_expects: "credential_store expects keychain or file"
  auto_update_expects: "auto_update expects on or off"

settings:
  expects_on_off: "%{key} expects on or off"
  expects_seconds: "%{key} expects a number of seconds"
  seconds_range: "%{key} must be between %{min} and %{max} seconds"
  quiet_hours_format: "quiet_hours expects HH:MM-HH:MM, or off"
  quiet_hours_example: "quiet_hours expects HH:MM-HH:MM, e.g. 22:00-08:00"
  unknown: "unknown setting '%{key}'. Settings: notify_on_done, notify_on_permission, notify_on_question, sound, quiet_when_present, quiet_hours, hold_ceiling_seconds, presence_threshold_seconds, stop_hold_seconds, reminder_interval_seconds"

forget:
  needs_yes: "ccn forget needs a yes from you: run it in a terminal, or add --yes"
  warning: "This erases this computer and its pairings from the Claude Code Notifier server, then\nremoves ccn from Claude Code and deletes its credentials and files here, as `ccn uninstall` does.\nPhones paired with this computer will see it disappear.\nA licence bought on the website is not cancelled: do that at claudecodenotifier.com/licence\nwith \"Erase my licence\"."
  # The word the user must type; `yes` is always accepted as well
  yes_word: "yes"
  prompt: "\nType %{yes} to continue: "
  nothing_erased: "Nothing was erased."
  erased: "Erased this computer and its pairings from the server."
  already_forgotten: "The server had already forgotten this computer."
  nothing_removed: "%{error}. Nothing was removed from this computer, so you can run `ccn forget` again"
  not_registered: "This computer isn't registered with the server, so there is nothing to erase there."

uninstall:
  hooks_removed: "Removed ccn's hooks from %{path}."
  slot_freed: "Freed this computer's licence slot."
  unpaired_all: "Unpaired every phone."
  removed_dir: "Removed %{path}."

local:
  finished_title: "Claude has finished"
  finished_body: "Claude has finished and is waiting for you."
  permission_title: "Claude needs permission"
  question_title: "Claude has a question"
  first_nudge: "Get these on your phone: ccn pair"
  milestone_nudge: "10 notifications so far. Get them on your phone, with approvals from the lock screen: run ccn pair"
  pair_message: "Claude Code Notifier: you get desktop notifications. To get them on your phone too, and approve or answer from there, run `ccn pair` in a terminal."

hook:
  licence_message: "Claude Code Notifier: phone notifications aren't unlocked for this computer. Unlock them: ccn unlock"
  unpaired_message: "Claude Code Notifier: this computer isn't paired any more, so your phone won't get notifications. Run `ccn pair` in a terminal to reconnect."
  unpaired_notification: "This computer isn't paired any more. Run `ccn pair` in a terminal to reconnect."
  paired_message: "Claude Code Notifier: paired with %{phone}. Notifications now go to your phone."
  # The server writes title, body and command in the user's language; this only joins them
  nudge_message: "Claude Code Notifier: %{title} %{body} %{command}"
  needs_attention: "Needs your attention"

licence:
  already_licensed: "This computer is already licensed (%{licence})."
  switch_to_lifetime: "To switch to a lifetime licence, keeping the same key: ccn unlock --lifetime"
