  checkout_link: "  Open this link to pay, or scan it with your phone:"
  waiting_payment: "  Waiting for the payment... (Ctrl+C to stop; the key is emailed to you either way)"
  upgraded: "✓ Upgraded to a lifetime licence. Same key, same computers; the annual renewal is cancelled."
  licensed: "✓ This computer is licensed (%{licence})."
  key: "  Key: %{key} (also emailed). Use it on up to 2 more computers: ccn activate %{key}"
  phones_unlocked: "  Every phone paired with this computer is unlocked."
  activate_with_key: "  Run `ccn activate <key>` with the emailed key to use it on this computer."
