  status_unlicensed: "%{licence}: ccn unlock"
  status_none: "none: ccn unlock"
  describe_refunded: "refunded"
  describe_lifetime: "lifetime"
  describe_renews: "annual, renews %{date}"
  describe_past_due: "annual, payment retrying"
  describe_ends: "annual, ends %{date}"
  describe_ended: "annual, ended %{date}"
