# Nederlands. Vertaling van locales/en.yml; zie locales/README.md. Register: "je", zoals de app en de pushberichten.
_version: 1

cli:
  about: "Claude Code Notifier: krijg een push op je telefoon wanneer Claude Code je nodig heeft, en antwoord van daar"
  pair:
    about: "Koppel deze computer aan je telefoon. Geef de code op die de app toont, of start zonder code om er een te krijgen die je in de app typt"
    code: "De 6-cijferige code die de Claude Code Notifier-app toont"
    name: "Hoe deze computer op je telefoon heet (standaard: de hostnaam)"
    replace_mac_app: "Verwijder ook de hook-regels van de Mac-menubalkapp, zodat meldingen niet dubbel worden verstuurd"
    no_wait: "Toon de QR-code en keer meteen terug: het koppelen rondt zichzelf af zodra de telefoon verbindt"
  setup:
    about: "Installeer de Claude Code-hooks en bureaubladmeldingen (pair en ccn zonder opdracht doen dit eerst)"
    replace_mac_app: "Verwijder ook de hook-regels van de Mac-menubalkapp"
  doctor:
    about: "Controleer hooks, inloggegevens, de server en wat deze terminal ondersteunt"
  test:
    about: "Stuur een testmelding naar elke gekoppelde telefoon"
  devices:
    about: "Toon gekoppelde telefoons, of trek er een in"
    revoke: "Trek een gekoppelde telefoon in op naam of id"
  config:
    about: "Toon of wijzig de instellingen van deze computer (ook aan te passen vanaf de telefoon)"
    show: "Druk de geldende instellingen af"
    set: "Stel één instelling in, bijv. `ccn config set hold_ceiling_seconds 300` of `ccn config set quiet_hours 22:00-08:00`"
  sync:
    about: "Haal nu de nieuwste instellingen van de server"
  unlock:
    about: "Koop in de browser een licentie voor deze computer: ontgrendelt elke telefoon die eraan gekoppeld is"
    lifetime: "Betaal eenmalig in plaats van jaarlijks (of zet een jaarlicentie om naar levenslang, met dezelfde sleutel)"
  upgrade:
    about: "Werk ccn bij naar de nieuwste versie (wordt ook eens per dag op de achtergrond gecontroleerd)"
    check: "Zeg alleen of er een nieuwere versie is: exit 0 als je bij bent, 10 als er een beschikbaar is"
    quiet: "Druk niets af tenzij er iets misging"
  activate:
    about: "Gebruik een licentiesleutel op deze computer (maximaal 3 computers per licentie)"
    key: "De sleutel uit je e-mail, CCN-XXXX-XXXX-XXXX-XXXX"
    replace: "Maak de plek van een andere computer op de licentie vrij, op naam, om ruimte te maken voor deze"
  deactivate:
    about: "Maak de licentieplek van deze computer vrij zodat de sleutel elders gebruikt kan worden"
  licence:
    about: "Toon de licentie van deze computer en de computers die hem gebruiken"
  uninstall:
    about: "Verwijder de hooks, inloggegevens, koppelingen en lokale gegevens"
  forget:
    about: "Wis deze computer en zijn koppelingen van de server, en verwijder ccn daarna"
    yes: "Niet om bevestiging vragen"

