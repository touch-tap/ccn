# Vietnamese. "Bạn" throughout, as the phone app and the push copy. Terminology follows the app:
# ghép nối (pair), giấy phép (licence), khóa giấy phép (licence key), mở khóa (unlock), máy tính,
# điện thoại, phê duyệt, thông báo, terminal. `hook` stays as the developers' word (it is the
# settings.json section name).
_version: 1

cli:
  about: "Claude Code Notifier: nhận thông báo trên điện thoại khi Claude Code cần bạn, và trả lời ngay từ đó"
  pair:
    about: "Ghép nối máy tính này với điện thoại của bạn. Truyền mã mà ứng dụng hiển thị, hoặc chạy không kèm mã để nhận một mã rồi nhập vào ứng dụng"
    code: "Mã 6 chữ số hiển thị trong ứng dụng Claude Code Notifier"
    name: "Tên của máy tính này trên điện thoại của bạn (mặc định: hostname)"
    replace_mac_app: "Đồng thời gỡ các mục hook của ứng dụng thanh menu trên Mac, để thông báo không bị gửi hai lần"
    no_wait: "Hiển thị mã QR rồi thoát ngay: việc ghép nối tự hoàn tất khi điện thoại kết nối"
  setup:
    about: "Cài các hook của Claude Code và thông báo trên máy tính (pair và ccn không kèm lệnh sẽ làm việc này trước)"
    replace_mac_app: "Đồng thời gỡ các mục hook của ứng dụng thanh menu trên Mac"
  doctor:
    about: "Kiểm tra hook, thông tin xác thực, máy chủ và những gì terminal này hỗ trợ"
  test:
    about: "Gửi một thông báo thử tới mọi điện thoại đã ghép nối"
  devices:
    about: "Liệt kê các điện thoại đã ghép nối, hoặc hủy ghép nối một chiếc"
    revoke: "Hủy ghép nối một điện thoại theo tên hoặc id"
  config:
    about: "Xem hoặc thay đổi cài đặt của máy tính này (cũng có thể chỉnh từ điện thoại)"
    show: "In ra các cài đặt đang có hiệu lực"
    set: "Đặt một cài đặt, ví dụ `ccn config set hold_ceiling_seconds 300` hoặc `ccn config set quiet_hours 22:00-08:00`"
  sync:
    about: "Lấy cài đặt mới nhất từ máy chủ ngay bây giờ"
  unlock:
    about: "Mua giấy phép cho máy tính này trong trình duyệt: mở khóa mọi điện thoại đã ghép nối với nó"
    lifetime: "Trả một lần thay vì hằng năm (hoặc chuyển giấy phép hằng năm sang trọn đời, giữ nguyên khóa)"
  upgrade:
    about: "Cập nhật ccn lên bản phát hành mới nhất (cũng được kiểm tra mỗi ngày một lần ở chế độ nền)"
    check: "Chỉ cho biết có bản mới hơn hay không: thoát với mã 0 khi đã mới nhất, 10 khi có bản mới"
    quiet: "Không in gì trừ khi có lỗi"
  activate:
    about: "Dùng một khóa giấy phép trên máy tính này (tối đa 3 máy tính cho mỗi giấy phép)"
    key: "Khóa trong email của bạn, CCN-XXXX-XXXX-XXXX-XXXX"
    replace: "Giải phóng chỗ của một máy tính khác trong giấy phép, theo tên, để nhường chỗ cho máy này"
  deactivate:
    about: "Giải phóng chỗ của máy tính này trong giấy phép để dùng khóa ở nơi khác"
  licence:
    about: "Xem giấy phép của máy tính này và các máy tính đang dùng nó"
  uninstall:
    about: "Gỡ các hook, thông tin xác thực, ghép nối và trạng thái cục bộ"
  forget:
    about: "Xóa máy tính này và các ghép nối của nó khỏi máy chủ, rồi gỡ cài đặt"
    yes: "Không hỏi xác nhận"

