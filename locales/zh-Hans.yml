# 简体中文。译自 locales/en.yml：键保持不变，只翻译值。%{name} 是运行时填入的占位符，
# 必须与英文完全一致。翻译规则见 locales/README.md。
_version: 1

cli:
  about: "Claude Code Notifier: Claude Code 需要你时，在手机上收到推送，并直接在手机上回复"
  pair:
    about: "把这台电脑与你的手机配对。传入应用显示的配对码，或不带配对码运行，获取一个输入到应用里的配对码"
    code: "Claude Code Notifier 应用中显示的 6 位配对码"
    name: "这台电脑在手机上显示的名称（默认: 主机名）"
    replace_mac_app: "同时移除 Mac 菜单栏应用的钩子条目，避免通知发送两次"
    no_wait: "显示二维码后立即返回: 手机连接后配对会自动完成"
  setup:
    about: "安装 Claude Code 的钩子和桌面通知（pair 和不带参数的 ccn 会先做这一步）"
    replace_mac_app: "同时移除 Mac 菜单栏应用的钩子条目"
  doctor:
    about: "检查钩子、凭据、服务器以及这个终端支持的功能"
  test:
    about: "向每部已配对的手机发送一条测试通知"
  devices:
    about: "列出已配对的手机，或撤销其中一部"
    revoke: "按名称或 ID 撤销一部已配对的手机"
  config:
    about: "查看或修改这台电脑的设置（也可以在手机上编辑）"
    show: "打印当前生效的设置"
    set: "修改一项设置，例如 `ccn config set hold_ceiling_seconds 300` 或 `ccn config set quiet_hours 22:00-08:00`"
  sync:
    about: "立即从服务器拉取最新设置"
  unlock:
    about: "在浏览器中为这台电脑购买许可: 解锁与它配对的每一部手机"
    lifetime: "一次付清而不是按年付费（也可以把年付许可换成永久许可，密钥不变）"
  upgrade:
    about: "把 ccn 更新到最新版本（后台每天也会检查一次）"
    check: "只报告是否有新版本: 已是最新则退出码为 0，有新版本则为 10"
    quiet: "除非出了问题，否则不打印任何内容"
  activate:
    about: "在这台电脑上使用许可密钥（每个许可最多 3 台电脑）"
    key: "邮件中的密钥，CCN-XXXX-XXXX-XXXX-XXXX"
    replace: "按名称释放许可上另一台电脑的名额，给这台电脑腾出位置"
  deactivate:
    about: "释放这台电脑占用的许可名额，让密钥可以在别处使用"
  licence:
    about: "显示这台电脑的许可以及正在使用它的电脑"
  uninstall:
    about: "移除钩子、凭据、配对和本地状态"
  forget:
    about: "从服务器上抹掉这台电脑及其配对，然后卸载"
    yes: "不要求确认"

common:
