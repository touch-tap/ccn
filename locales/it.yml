# Italiano. Traduce locales/en.yml; vedi locales/README.md. Registro: tu. Vocabolario dell'app
# Claude Code Notifier: abbinare (pair), collegare (connect), licenza, sbloccare, telefono, computer.
_version: 1

cli:
  about: "Claude Code Notifier: ricevi una notifica sul telefono quando Claude Code ha bisogno di te e rispondi da lì"
  pair:
    about: "Abbinare questo computer al tuo telefono. Passa il codice mostrato dall'app, oppure esegui senza codice per averne uno da digitare nell'app"
    code: "Il codice a 6 cifre mostrato nell'app Claude Code Notifier"
    name: "Il nome di questo computer sul tuo telefono (predefinito: l'hostname)"
    replace_mac_app: "Rimuovere anche gli hook dell'app nella barra dei menu del Mac, così le notifiche non arrivano due volte"
    no_wait: "Mostrare il codice QR e uscire subito: l'abbinamento si completa da solo quando il telefono si collega"
  setup:
    about: "Installare gli hook di Claude Code e le notifiche sul desktop (pair e ccn senza argomenti lo fanno per primi)"
    replace_mac_app: "Rimuovere anche gli hook dell'app nella barra dei menu del Mac"
  doctor:
    about: "Controllare hook, credenziali, server e cosa supporta questo terminale"
  test:
    about: "Inviare una notifica di prova a ogni telefono abbinato"
  devices:
    about: "Elencare i telefoni abbinati, o revocarne uno"
    revoke: "Revocare un telefono abbinato per nome o id"
  config:
    about: "Mostrare o cambiare le impostazioni di questo computer (modificabili anche dal telefono)"
    show: "Stampare le impostazioni in vigore"
    set: "Impostare un valore, es. `ccn config set hold_ceiling_seconds 300` o `ccn config set quiet_hours 22:00-08:00`"
  sync:
    about: "Scaricare subito le ultime impostazioni dal server"
  unlock:
    about: "Comprare una licenza per questo computer nel browser: sblocca ogni telefono abbinato a esso"
    lifetime: "Pagare una volta sola invece che ogni anno (o passare una licenza annuale a vita, mantenendo la chiave)"
  upgrade:
    about: "Aggiornare ccn all'ultima versione (controllato anche una volta al giorno in background)"
    check: "Dire soltanto se esiste una versione più recente: esce con 0 se aggiornato, 10 se ce n'è una"
    quiet: "Non stampare nulla, a meno che qualcosa sia andato storto"
  activate:
    about: "Usare una chiave di licenza su questo computer (fino a 3 computer per licenza)"
    key: "La chiave ricevuta via email, CCN-XXXX-XXXX-XXXX-XXXX"
    replace: "Liberare il posto di un altro computer sulla licenza, per nome, per fare spazio a questo"
  deactivate:
    about: "Liberare il posto di questo computer sulla licenza, così la chiave si può usare altrove"
  licence:
    about: "Mostrare la licenza di questo computer e i computer che la usano"
  uninstall:
    about: "Rimuovere hook, credenziali, abbinamenti e stato locale"
  forget:
    about: "Cancellare questo computer e i suoi abbinamenti dal server, poi disinstallare"
    yes: "Non chiedere conferma"

