# 日本語。locales/en.yml を翻訳したもの。キーは変えず、値だけ訳す。%{name} は実行時に埋められる
# プレースホルダーなので、英語と同じものをそのまま残す。訳し方の決まりは locales/README.md を参照。
_version: 1

cli:
  about: "Claude Code Notifier: Claude Code があなたを必要とするときスマートフォンにプッシュ通知を届け、その場で返答できます"
  pair:
    about: "このコンピュータをスマートフォンとペアリングします。アプリに表示されたコードを渡すか、コードなしで実行してアプリに入力するコードを取得します"
    code: "Claude Code Notifier アプリに表示される6桁のコード"
    name: "スマートフォン上でのこのコンピュータの名前（デフォルト: ホスト名）"
    replace_mac_app: "Mac メニューバーアプリのフック設定も削除し、通知が二重に送られないようにします"
    no_wait: "QR コードを表示してすぐ戻ります。スマートフォンが接続するとペアリングは自動で完了します"
  setup:
    about: "Claude Code のフックとデスクトップ通知をインストールします（pair と引数なしの ccn は最初にこれを行います）"
    replace_mac_app: "Mac メニューバーアプリのフック設定も削除します"
  doctor:
    about: "フック、認証情報、サーバー、このターミナルの対応状況を確認します"
  test:
    about: "ペアリング済みのすべてのスマートフォンにテスト通知を送ります"
  devices:
    about: "ペアリング済みのスマートフォンを一覧表示、または解除します"
    revoke: "名前または ID を指定してスマートフォンのペアリングを解除します"
  config:
    about: "このコンピュータの設定を表示または変更します（スマートフォンからも編集できます）"
    show: "有効な設定を表示します"
    set: "設定を1つ変更します。例: `ccn config set hold_ceiling_seconds 300` や `ccn config set quiet_hours 22:00-08:00`"
  sync:
    about: "サーバーから最新の設定を今すぐ取得します"
  unlock:
    about: "ブラウザでこのコンピュータのライセンスを購入します。ペアリングしたすべてのスマートフォンがロック解除されます"
    lifetime: "年額ではなく一回払いにします（年間ライセンスを買い切りに切り替える場合もキーはそのまま）"
  upgrade:
    about: "ccn を最新リリースに更新します（1日1回バックグラウンドでも確認します）"
    check: "新しいリリースがあるかだけを報告します。最新なら終了コード 0、更新があれば 10"
    quiet: "問題が起きたとき以外は何も表示しません"
  activate:
    about: "このコンピュータでライセンスキーを使います（1つのライセンスで最大3台）"
    key: "メールで届いたキー（CCN-XXXX-XXXX-XXXX-XXXX）"
    replace: "ライセンス上の別のコンピュータを名前で指定して枠を空け、このコンピュータ用にします"
  deactivate:
    about: "このコンピュータのライセンス枠を空け、キーを別の場所で使えるようにします"
  licence:
    about: "このコンピュータのライセンスと、それを使っているコンピュータを表示します"
  uninstall:
    about: "フック、認証情報、ペアリング、ローカルの状態を削除します"
  forget:
    about: "このコンピュータとそのペアリングをサーバーから消去し、アンインストールします"
    yes: "確認せずに実行します"

common:
