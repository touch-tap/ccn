# Español. Traduce locales/en.yml; ver locales/README.md. Registro: tú, sin vosotros. Vocabulario de
# la app Claude Code Notifier: vincular (pair), conectar (connect), licencia, desbloquear, móvil, ordenador.
_version: 1

cli:
  about: "Claude Code Notifier: recibe un aviso en el móvil cuando Claude Code te necesite y responde desde ahí"
  pair:
    about: "Vincular este ordenador con tu móvil. Pasa el código que muestra la app, o ejecútalo sin código para obtener uno que escribir en la app"
    code: "El código de 6 dígitos que muestra la app Claude Code Notifier"
    name: "Cómo se llama este ordenador en tu móvil (por defecto: el nombre de host)"
    replace_mac_app: "Quitar también los hooks de la app de la barra de menús del Mac, para no enviar las notificaciones dos veces"
    no_wait: "Mostrar el código QR y volver de inmediato: la vinculación se completa sola cuando el móvil se conecta"
  setup:
    about: "Instalar los hooks de Claude Code y las notificaciones de escritorio (pair y ccn sin argumentos lo hacen primero)"
    replace_mac_app: "Quitar también los hooks de la app de la barra de menús del Mac"
  doctor:
    about: "Comprobar los hooks, las credenciales, el servidor y lo que admite esta terminal"
  test:
    about: "Enviar una notificación de prueba a cada móvil vinculado"
  devices:
    about: "Listar los móviles vinculados, o revocar uno"
    revoke: "Revocar un móvil vinculado por su nombre o id"
  config:
    about: "Ver o cambiar los ajustes de este ordenador (también editables desde el móvil)"
    show: "Mostrar los ajustes en vigor"
    set: "Cambiar un ajuste, p. ej. `ccn config set hold_ceiling_seconds 300` o `ccn config set quiet_hours 22:00-08:00`"
  sync:
    about: "Traer ahora los últimos ajustes del servidor"
  unlock:
    about: "Comprar una licencia para este ordenador en el navegador: desbloquea todos los móviles vinculados con él"
    lifetime: "Pagar una sola vez en lugar de cada año (o pasar una licencia anual a permanente, conservando la clave)"
  upgrade:
    about: "Actualizar ccn a la última versión (también se comprueba una vez al día en segundo plano)"
    check: "Solo decir si existe una versión más reciente: código 0 si está al día, 10 si hay una disponible"
    quiet: "No mostrar nada salvo que algo haya fallado"
  activate:
    about: "Usar una clave de licencia en este ordenador (hasta 3 ordenadores por licencia)"
    key: "La clave de tu correo, CCN-XXXX-XXXX-XXXX-XXXX"
    replace: "Liberar la plaza de otro ordenador en la licencia, por su nombre, para hacer sitio a este"
  deactivate:
    about: "Liberar la plaza de este ordenador en la licencia para usar la clave en otro sitio"
  licence:
    about: "Mostrar la licencia de este ordenador y los ordenadores que la usan"
  uninstall:
    about: "Quitar los hooks, las credenciales, las vinculaciones y el estado local"
  forget:
    about: "Borrar este ordenador y sus vinculaciones del servidor, y luego desinstalar"
    yes: "No pedir confirmación"

