# Deutsch. Übersetzt locales/en.yml; siehe locales/README.md. Register: du. Begriffe wie in der
# Claude Code Notifier App: koppeln (pair), verbinden (connect), Lizenz, freischalten, Handy, Computer.
_version: 1

cli:
  about: "Claude Code Notifier: bekomme einen Push aufs Handy, wenn Claude Code dich braucht, und antworte von dort"
  pair:
    about: "Diesen Computer mit deinem Handy koppeln. Gib den Code aus der App an, oder starte ohne Code und bekomme einen zum Eintippen in die App"
    code: "Der 6-stellige Code aus der Claude Code Notifier App"
    name: "Wie dieser Computer auf deinem Handy heißt (Standard: der Hostname)"
    replace_mac_app: "Auch die Hook-Einträge der Mac-Menüleisten-App entfernen, damit Mitteilungen nicht doppelt gesendet werden"
    no_wait: "QR-Code anzeigen und sofort zurückkehren: die Kopplung wird von selbst abgeschlossen, sobald das Handy sich verbindet"
  setup:
    about: "Die Claude Code Hooks und Desktop-Mitteilungen installieren (pair und ccn ohne Argumente tun das zuerst)"
    replace_mac_app: "Auch die Hook-Einträge der Mac-Menüleisten-App entfernen"
  doctor:
    about: "Hooks, Zugangsdaten, Server und die Fähigkeiten dieses Terminals prüfen"
  test:
    about: "Eine Testmitteilung an jedes gekoppelte Handy senden"
  devices:
    about: "Gekoppelte Handys auflisten oder eines entkoppeln"
    revoke: "Ein gekoppeltes Handy per Name oder ID entkoppeln"
  config:
    about: "Einstellungen dieses Computers anzeigen oder ändern (auch vom Handy aus änderbar)"
    show: "Die wirksamen Einstellungen ausgeben"
    set: "Eine Einstellung setzen, z. B. `ccn config set hold_ceiling_seconds 300` oder `ccn config set quiet_hours 22:00-08:00`"
  sync:
    about: "Die neuesten Einstellungen jetzt vom Server holen"
  unlock:
    about: "Eine Lizenz für diesen Computer im Browser kaufen: schaltet jedes damit gekoppelte Handy frei"
    lifetime: "Einmal zahlen statt jährlich (oder eine Jahreslizenz auf lebenslang umstellen, der Schlüssel bleibt)"
  upgrade:
    about: "ccn auf die neueste Version aktualisieren (wird auch einmal täglich im Hintergrund geprüft)"
    check: "Nur sagen, ob eine neuere Version existiert: Exit 0 wenn aktuell, 10 wenn eine verfügbar ist"
    quiet: "Nichts ausgeben, außer etwas ist schiefgegangen"
  activate:
    about: "Einen Lizenzschlüssel auf diesem Computer verwenden (bis zu 3 Computer pro Lizenz)"
    key: "Der Schlüssel aus deiner E-Mail, CCN-XXXX-XXXX-XXXX-XXXX"
    replace: "Den Platz eines anderen Computers auf der Lizenz freigeben, per Name, um Platz für diesen zu machen"
  deactivate:
    about: "Den Lizenzplatz dieses Computers freigeben, damit der Schlüssel anderswo verwendet werden kann"
  licence:
    about: "Die Lizenz dieses Computers und die Computer, die sie nutzen, anzeigen"
  uninstall:
    about: "Hooks, Zugangsdaten, Kopplungen und lokalen Zustand entfernen"
  forget:
    about: "Diesen Computer und seine Kopplungen vom Server löschen, dann deinstallieren"
    yes: "Nicht um Bestätigung fragen"

