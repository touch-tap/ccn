# 繁體中文。譯自 locales/en.yml：鍵保持不變，只翻譯值。%{name} 是執行時填入的佔位符，
# 必須與英文完全一致。翻譯規則見 locales/README.md。
_version: 1

cli:
  about: "Claude Code Notifier: Claude Code 需要你時，在手機上收到推播，並直接在手機上回覆"
  pair:
    about: "把這台電腦與你的手機配對。傳入 App 顯示的配對碼，或不帶配對碼執行，取得一個輸入到 App 裡的配對碼"
    code: "Claude Code Notifier App 中顯示的 6 位配對碼"
    name: "這台電腦在手機上顯示的名稱（預設: 主機名稱）"
    replace_mac_app: "同時移除 Mac 選單列 App 的鉤子項目，避免通知傳送兩次"
    no_wait: "顯示 QR 碼後立即返回: 手機連線後配對會自動完成"
  setup:
    about: "安裝 Claude Code 的鉤子和桌面通知（pair 和不帶參數的 ccn 會先做這一步）"
    replace_mac_app: "同時移除 Mac 選單列 App 的鉤子項目"
  doctor:
    about: "檢查鉤子、憑證、伺服器以及這個終端機支援的功能"
  test:
    about: "向每部已配對的手機傳送一則測試通知"
  devices:
    about: "列出已配對的手機，或撤銷其中一部"
    revoke: "依名稱或 ID 撤銷一部已配對的手機"
  config:
    about: "查看或修改這台電腦的設定（也可以在手機上編輯）"
    show: "列出目前生效的設定"
    set: "修改一項設定，例如 `ccn config set hold_ceiling_seconds 300` 或 `ccn config set quiet_hours 22:00-08:00`"
  sync:
    about: "立即從伺服器拉取最新設定"
  unlock:
    about: "在瀏覽器中為這台電腦購買授權: 解鎖與它配對的每一部手機"
    lifetime: "一次付清而不是按年付費（也可以把年繳授權換成終身授權，金鑰不變）"
  upgrade:
    about: "把 ccn 更新到最新版本（背景每天也會檢查一次）"
    check: "只回報是否有新版本: 已是最新則結束代碼為 0，有新版本則為 10"
    quiet: "除非出了問題，否則不輸出任何內容"
  activate:
    about: "在這台電腦上使用授權金鑰（每個授權最多 3 台電腦）"
    key: "電子郵件中的金鑰，CCN-XXXX-XXXX-XXXX-XXXX"
    replace: "依名稱釋放授權上另一台電腦的名額，給這台電腦騰出位置"
  deactivate:
    about: "釋放這台電腦佔用的授權名額，讓金鑰可以在別處使用"
  licence:
    about: "顯示這台電腦的授權以及正在使用它的電腦"
  uninstall:
    about: "移除鉤子、憑證、配對和本機狀態"
  forget:
    about: "從伺服器上抹除這台電腦及其配對，然後解除安裝"
    yes: "不要求確認"

common:
