# Arabic. Modern Standard Arabic, second person singular for instructions, as the phone app does.
# Terminology follows the app and the server push copy: ربط (pair), ترخيص (licence), مفتاح ترخيص
# (licence key), تفعيل/مفعّل (unlock/unlocked), الكمبيوتر, الهاتف, الموافقات, الإشعارات, الطرفية.
# `hooks` stays in Latin (it is the settings.json section name); commands sit at the start or the
# end of a sentence so a left-to-right terminal shows mixed lines readably.
_version: 1

cli:
  about: "Claude Code Notifier: يصلك إشعار على هاتفك عندما يحتاجك Claude Code، وتجيب من هناك"
  pair:
    about: "اربط هذا الكمبيوتر بهاتفك. أدخل الرمز الذي يعرضه التطبيق، أو شغّل الأمر بلا رمز لتحصل على رمز تكتبه في التطبيق"
    code: "الرمز المكوّن من 6 أرقام المعروض في تطبيق Claude Code Notifier"
    name: "اسم هذا الكمبيوتر كما يظهر على هاتفك (الافتراضي: اسم المضيف)"
    replace_mac_app: "أزل أيضًا إدخالات hooks الخاصة بتطبيق شريط القوائم على Mac، كي لا تُرسل الإشعارات مرتين"
    no_wait: "اعرض رمز QR وارجع فورًا: يكتمل الربط من تلقاء نفسه عندما يتصل الهاتف"
  setup:
    about: "ثبّت hooks الخاصة بـ Claude Code وإشعارات سطح المكتب (يقوم pair وتشغيل ccn بلا أمر بهذا أولًا)"
    replace_mac_app: "أزل أيضًا إدخالات hooks الخاصة بتطبيق شريط القوائم على Mac"
  doctor:
    about: "افحص hooks وبيانات الاعتماد والخادم وما تدعمه هذه الطرفية"
  test:
    about: "أرسل إشعارًا تجريبيًا إلى كل هاتف مرتبط"
  devices:
    about: "اعرض الهواتف المرتبطة، أو ألغِ ربط أحدها"
    revoke: "ألغِ ربط هاتف بالاسم أو المعرّف"
  config:
    about: "اعرض أو غيّر إعدادات هذا الكمبيوتر (يمكن تعديلها من الهاتف أيضًا)"
    show: "اطبع الإعدادات الفعلية"
    set: "عيّن إعدادًا واحدًا، مثل `ccn config set hold_ceiling_seconds 300` أو `ccn config set quiet_hours 22:00-08:00`"
  sync:
    about: "اجلب أحدث الإعدادات من الخادم الآن"
  unlock:
    about: "اشترِ ترخيصًا لهذا الكمبيوتر في المتصفح: يفعّل كل هاتف مرتبط به"
    lifetime: "ادفع مرة واحدة بدلًا من الدفع سنويًا (أو حوّل ترخيصًا سنويًا إلى مدى الحياة مع الاحتفاظ بالمفتاح)"
  upgrade:
    about: "حدّث ccn إلى أحدث إصدار (يُفحص ذلك أيضًا مرة يوميًا في الخلفية)"
    check: "اكتفِ بالإبلاغ عن وجود إصدار أحدث: رمز الخروج 0 إن كان الإصدار الحالي هو الأحدث، و10 إن توفر إصدار أحدث"
    quiet: "لا تطبع شيئًا إلا إذا حدث خطأ"
  activate:
    about: "استخدم مفتاح ترخيص على هذا الكمبيوتر (حتى 3 أجهزة كمبيوتر لكل ترخيص)"
    key: "المفتاح الوارد في بريدك الإلكتروني، CCN-XXXX-XXXX-XXXX-XXXX"
    replace: "أفرغ مكان كمبيوتر آخر على الترخيص، باسمه، لإفساح المجال لهذا الكمبيوتر"
  deactivate:
    about: "أفرغ مكان هذا الكمبيوتر على الترخيص ليُستخدم المفتاح في مكان آخر"
  licence:
    about: "اعرض ترخيص هذا الكمبيوتر وأجهزة الكمبيوتر التي تستخدمه"
  uninstall:
    about: "أزل hooks وبيانات الاعتماد والارتباطات والحالة المحلية"
  forget:
    about: "امسح هذا الكمبيوتر وارتباطاته من الخادم، ثم أزل التثبيت"
    yes: "لا تطلب التأكيد"

