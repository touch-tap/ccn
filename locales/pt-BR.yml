# Português do Brasil. Tradução de locales/en.yml; veja locales/README.md. Registro: "você", como o app e as notificações push.
_version: 1

cli:
  about: "Claude Code Notifier: receba um push no celular quando o Claude Code precisar de você e responda de lá"
  pair:
    about: "Pareie este computador com seu celular. Passe o código que o app mostra, ou rode sem código para receber um e digitar no app"
    code: "O código de 6 dígitos mostrado no app Claude Code Notifier"
    name: "Como este computador aparece no seu celular (padrão: o hostname)"
    replace_mac_app: "Remova também os hooks do app da barra de menus do Mac, para as notificações não chegarem em dobro"
    no_wait: "Mostre o QR code e saia na hora: o pareamento termina sozinho quando o celular se conecta"
  setup:
    about: "Instale os hooks do Claude Code e as notificações do desktop (pair e ccn sem comando fazem isso primeiro)"
    replace_mac_app: "Remova também os hooks do app da barra de menus do Mac"
  doctor:
    about: "Verifique hooks, credenciais, o servidor e o que este terminal suporta"
  test:
    about: "Envie uma notificação de teste a todos os celulares pareados"
  devices:
    about: "Liste os celulares pareados ou revogue um"
    revoke: "Revogue um celular pareado pelo nome ou id"
  config:
    about: "Mostre ou altere as configurações deste computador (também editáveis pelo celular)"
    show: "Imprima as configurações em vigor"
    set: "Defina uma configuração, ex. `ccn config set hold_ceiling_seconds 300` ou `ccn config set quiet_hours 22:00-08:00`"
  sync:
    about: "Baixe agora as configurações mais recentes do servidor"
  unlock:
    about: "Compre no navegador uma licença para este computador: desbloqueia todos os celulares pareados com ele"
    lifetime: "Pague uma vez em vez de por ano (ou passe uma licença anual para vitalícia, mantendo a chave)"
  upgrade:
    about: "Atualize o ccn para a versão mais recente (também verificado uma vez por dia em segundo plano)"
    check: "Só diga se há uma versão mais nova: sai com 0 quando está atualizado, 10 quando há uma disponível"
    quiet: "Não imprima nada, a não ser que algo dê errado"
  activate:
    about: "Use uma chave de licença neste computador (até 3 computadores por licença)"
    key: "A chave do seu e-mail, CCN-XXXX-XXXX-XXXX-XXXX"
    replace: "Libere a vaga de outro computador na licença, pelo nome dele, para abrir espaço para este"
  deactivate:
    about: "Libere a vaga de licença deste computador para usar a chave em outro lugar"
  licence:
    about: "Mostre a licença deste computador e os computadores que a usam"
  uninstall:
    about: "Remova os hooks, credenciais, pareamentos e o estado local"
  forget:
    about: "Apague este computador e seus pareamentos do servidor, depois desinstale"
    yes: "Não pedir confirmação"

