# Русский. Перевод locales/en.yml; см. locales/README.md. Регистр: «вы» со строчной, как в приложении и push-уведомлениях.
_version: 1

cli:
  about: "Claude Code Notifier: получайте push на телефон, когда вы нужны Claude Code, и отвечайте оттуда"
  pair:
    about: "Подключить этот компьютер к телефону. Укажите код из приложения или запустите без кода, чтобы получить код для ввода в приложении"
    code: "6-значный код, который показывает приложение Claude Code Notifier"
    name: "Как этот компьютер называется на телефоне (по умолчанию: имя хоста)"
    replace_mac_app: "Также убрать хуки приложения из строки меню Mac, чтобы уведомления не приходили дважды"
    no_wait: "Показать QR-код и сразу выйти: подключение завершится само, когда телефон подключится"
  setup:
    about: "Установить хуки Claude Code и уведомления на рабочем столе (pair и ccn без команды делают это первыми)"
    replace_mac_app: "Также убрать хуки приложения из строки меню Mac"
  doctor:
    about: "Проверить хуки, учётные данные, сервер и возможности этого терминала"
  test:
    about: "Отправить тестовое уведомление на все подключённые телефоны"
  devices:
    about: "Показать подключённые телефоны или отключить один из них"
    revoke: "Отключить телефон по имени или id"
  config:
    about: "Показать или изменить настройки этого компьютера (их можно менять и с телефона)"
    show: "Вывести действующие настройки"
    set: "Задать одну настройку, например `ccn config set hold_ceiling_seconds 300` или `ccn config set quiet_hours 22:00-08:00`"
  sync:
    about: "Загрузить последние настройки с сервера сейчас"
  unlock:
    about: "Купить лицензию на этот компьютер в браузере: разблокирует каждый подключённый к нему телефон"
    lifetime: "Заплатить один раз вместо ежегодной оплаты (или перевести годовую лицензию в бессрочную, сохранив ключ)"
  upgrade:
    about: "Обновить ccn до последней версии (проверяется также раз в день в фоне)"
    check: "Только сообщить, есть ли новая версия: код выхода 0, если всё актуально, 10, если версия доступна"
    quiet: "Ничего не выводить, если не произошло ошибки"
  activate:
    about: "Использовать лицензионный ключ на этом компьютере (до 3 компьютеров на лицензию)"
    key: "Ключ из вашего письма, CCN-XXXX-XXXX-XXXX-XXXX"
    replace: "Освободить место другого компьютера в лицензии, по его имени, чтобы занять его этим"
  deactivate:
    about: "Освободить место этого компьютера в лицензии, чтобы использовать ключ в другом месте"
  licence:
    about: "Показать лицензию этого компьютера и компьютеры, которые её используют"
  uninstall:
    about: "Удалить хуки, учётные данные, подключения и локальные данные"
  forget:
    about: "Стереть этот компьютер и его подключения с сервера, затем удалить ccn"
    yes: "Не спрашивать подтверждения"

