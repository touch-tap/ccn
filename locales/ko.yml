  setup:
    about: "Claude Code 훅과 데스크톱 알림을 설치해요 (pair와 인수 없는 ccn이 먼저 하는 일이에요)"
    replace_mac_app: "Mac 메뉴 막대 앱의 훅 항목도 제거해요"
  doctor:
    about: "훅, 인증 정보, 서버, 이 터미널이 지원하는 기능을 점검해요"
  test:
    about: "연결된 모든 휴대폰에 테스트 알림을 보내요"
  devices:
    about: "연결된 휴대폰을 나열하거나 하나를 해제해요"
    revoke: "이름이나 ID로 연결된 휴대폰을 해제해요"
  config:
    about: "이 컴퓨터의 설정을 보거나 바꿔요 (휴대폰에서도 편집할 수 있어요)"
    show: "적용 중인 설정을 출력해요"
    set: "설정 하나를 바꿔요. 예: `ccn config set hold_ceiling_seconds 300` 또는 `ccn config set quiet_hours 22:00-08:00`"
  sync:
    about: "서버에서 최신 설정을 지금 받아와요"
  unlock:
    about: "브라우저에서 이 컴퓨터의 라이선스를 구매해요. 이 컴퓨터에 연결된 모든 휴대폰이 잠금 해제돼요"
    lifetime: "매년 대신 한 번만 결제해요 (연간 라이선스를 평생 이용으로 바꿀 때도 키는 그대로예요)"
  upgrade:
    about: "ccn을 최신 릴리스로 업데이트해요 (하루에 한 번 백그라운드에서도 확인해요)"
    check: "새 릴리스가 있는지만 알려요. 최신이면 종료 코드 0, 업데이트가 있으면 10"
    quiet: "문제가 생긴 경우가 아니면 아무것도 출력하지 않아요"
  activate:
    about: "이 컴퓨터에서 라이선스 키를 사용해요 (라이선스 하나로 최대 3대)"
    key: "이메일로 받은 키, CCN-XXXX-XXXX-XXXX-XXXX"
    replace: "라이선스에 있는 다른 컴퓨터를 이름으로 지정해 자리를 비우고, 이 컴퓨터가 쓰게 해요"
  deactivate:
    about: "이 컴퓨터의 라이선스 자리를 비워서 키를 다른 곳에서 쓸 수 있게 해요"
  licence:
    about: "이 컴퓨터의 라이선스와 그것을 쓰는 컴퓨터들을 보여줘요"
  uninstall:
    about: "훅, 인증 정보, 연결, 로컬 상태를 제거해요"
  forget:
    about: "이 컴퓨터와 연결 정보를 서버에서 지운 뒤 제거해요"
    yes: "확인을 묻지 않아요"

