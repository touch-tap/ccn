  pair:
    about: "이 컴퓨터를 휴대폰과 연결해요. 앱에 표시된 코드를 넘기거나, 코드 없이 실행해 앱에 입력할 코드를 받으세요"
    code: "Claude Code Notifier 앱에 표시된 6자리 코드"
    name: "휴대폰에 표시되는 이 컴퓨터의 이름 (기본값: 호스트 이름)"
