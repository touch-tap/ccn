# 한국어. locales/en.yml을 번역한 파일. 키는 그대로 두고 값만 번역해요. %{name}은 실행 시 채워지는
# 자리 표시자이므로 영어와 똑같이 남겨 두세요. 번역 규칙은 locales/README.md를 참고하세요.
_version: 1

cli:
