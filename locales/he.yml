# Hebrew. Plural imperative where English gives an instruction (הריצו, סרקו), neutral elsewhere, as
# the app and the push copy do. Terminology follows the app: צימוד (pair), רישיון (licence), מפתח
# רישיון (licence key), פתיחה/פתוח (unlock/unlocked), מחשב, טלפון, אישורים, התראות, טרמינל.
# `hooks` stays in Latin (it is the settings.json section name); commands sit at the start or the
# end of a sentence so a left-to-right terminal shows mixed lines readably.
_version: 1

cli:
  about: "Claude Code Notifier: קבלו התראה בטלפון כש-Claude Code צריך אתכם, וענו משם"
  pair:
    about: "צמדו את המחשב הזה לטלפון. העבירו את הקוד שהאפליקציה מציגה, או הריצו בלי קוד כדי לקבל קוד להקלדה באפליקציה"
    code: "הקוד בן 6 הספרות שמוצג באפליקציית Claude Code Notifier"
    name: "השם של המחשב הזה בטלפון (ברירת המחדל: שם המארח)"
    replace_mac_app: "הסירו גם את רשומות ה-hooks של אפליקציית שורת התפריטים ב-Mac, כדי שהתראות לא יישלחו פעמיים"
    no_wait: "הציגו את קוד ה-QR וחזרו מיד: הצימוד מסתיים מעצמו כשהטלפון מתחבר"
  setup:
    about: "התקינו את ה-hooks של Claude Code והתראות שולחן העבודה (pair ו-ccn בלי פקודה עושים זאת קודם)"
    replace_mac_app: "הסירו גם את רשומות ה-hooks של אפליקציית שורת התפריטים ב-Mac"
  doctor:
    about: "בדקו את ה-hooks, פרטי הגישה, השרת ומה הטרמינל הזה תומך בו"
  test:
    about: "שלחו התראת בדיקה לכל טלפון מצומד"
  devices:
    about: "הציגו את הטלפונים המצומדים, או בטלו צימוד של אחד מהם"
    revoke: "בטלו צימוד של טלפון לפי שם או מזהה"
  config:
    about: "הציגו או שנו את ההגדרות של המחשב הזה (אפשר לערוך גם מהטלפון)"
    show: "הדפיסו את ההגדרות בתוקף"
    set: "קבעו הגדרה אחת, למשל `ccn config set hold_ceiling_seconds 300` או `ccn config set quiet_hours 22:00-08:00`"
  sync:
    about: "משכו עכשיו את ההגדרות העדכניות מהשרת"
  unlock:
    about: "רכשו רישיון למחשב הזה בדפדפן: פותח כל טלפון שמצומד אליו"
    lifetime: "תשלום אחד במקום שנתי (או העברת רישיון שנתי לרישיון לכל החיים, עם אותו מפתח)"
  upgrade:
    about: "עדכנו את ccn לגרסה האחרונה (נבדק גם פעם ביום ברקע)"
    check: "רק דווחו אם קיימת גרסה חדשה: יציאה 0 כשהכול מעודכן, 10 כשיש גרסה חדשה"
    quiet: "אל תדפיסו דבר אלא אם משהו השתבש"
  activate:
    about: "השתמשו במפתח רישיון במחשב הזה (עד 3 מחשבים לרישיון)"
    key: "המפתח מהאימייל שלכם, CCN-XXXX-XXXX-XXXX-XXXX"
    replace: "שחררו את המקום של מחשב אחר ברישיון, לפי שמו, כדי לפנות מקום למחשב הזה"
  deactivate:
    about: "שחררו את מקום הרישיון של המחשב הזה כדי שאפשר יהיה להשתמש במפתח במקום אחר"
  licence:
    about: "הציגו את הרישיון של המחשב הזה ואת המחשבים שמשתמשים בו"
  uninstall:
    about: "הסירו את ה-hooks, פרטי הגישה, הצימודים והמצב המקומי"
  forget:
    about: "מחקו את המחשב הזה ואת הצימודים שלו מהשרת, ואז הסירו את ההתקנה"
    yes: "לא לבקש אישור"

