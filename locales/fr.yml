# Français. Traduit locales/en.yml ; voir locales/README.md. Registre : tu. Vocabulaire de l'app
# Claude Code Notifier : jumeler (pair), connecter (connect), licence, débloquer, téléphone, ordinateur.
_version: 1

cli:
  about: "Claude Code Notifier : reçois une notification sur ton téléphone quand Claude Code a besoin de toi, et réponds depuis là"
  pair:
    about: "Jumeler cet ordinateur avec ton téléphone. Donne le code affiché par l'app, ou lance sans code pour en obtenir un à saisir dans l'app"
    code: "Le code à 6 chiffres affiché dans l'app Claude Code Notifier"
    name: "Le nom de cet ordinateur sur ton téléphone (par défaut : le nom d'hôte)"
    replace_mac_app: "Retirer aussi les hooks de l'app de la barre des menus du Mac, pour ne pas envoyer les notifications en double"
    no_wait: "Afficher le QR code et rendre la main tout de suite : le jumelage se termine tout seul quand le téléphone se connecte"
  setup:
    about: "Installer les hooks Claude Code et les notifications de bureau (pair et ccn sans argument le font d'abord)"
    replace_mac_app: "Retirer aussi les hooks de l'app de la barre des menus du Mac"
  doctor:
    about: "Vérifier les hooks, les identifiants, le serveur et ce que ce terminal sait faire"
  test:
    about: "Envoyer une notification de test à chaque téléphone jumelé"
  devices:
    about: "Lister les téléphones jumelés, ou en révoquer un"
    revoke: "Révoquer un téléphone jumelé par son nom ou son id"
  config:
    about: "Afficher ou changer les réglages de cet ordinateur (modifiables aussi depuis le téléphone)"
    show: "Afficher les réglages en vigueur"
    set: "Changer un réglage, p. ex. `ccn config set hold_ceiling_seconds 300` ou `ccn config set quiet_hours 22:00-08:00`"
  sync:
    about: "Récupérer maintenant les derniers réglages depuis le serveur"
  unlock:
    about: "Acheter une licence pour cet ordinateur dans le navigateur : débloque tous les téléphones qui lui sont jumelés"
    lifetime: "Payer une seule fois au lieu de chaque année (ou passer une licence annuelle à vie, en gardant la clé)"
  upgrade:
    about: "Mettre ccn à jour vers la dernière version (vérifié aussi une fois par jour en arrière-plan)"
    check: "Dire seulement s'il existe une version plus récente : code 0 si à jour, 10 s'il y en a une"
    quiet: "N'afficher rien, sauf si quelque chose a mal tourné"
  activate:
    about: "Utiliser une clé de licence sur cet ordinateur (jusqu'à 3 ordinateurs par licence)"
    key: "La clé reçue par e-mail, CCN-XXXX-XXXX-XXXX-XXXX"
    replace: "Libérer la place d'un autre ordinateur sur la licence, par son nom, pour faire de la place à celui-ci"
  deactivate:
    about: "Libérer la place de cet ordinateur sur la licence pour utiliser la clé ailleurs"
  licence:
    about: "Afficher la licence de cet ordinateur et les ordinateurs qui l'utilisent"
  uninstall:
    about: "Retirer les hooks, les identifiants, les jumelages et l'état local"
  forget:
    about: "Effacer cet ordinateur et ses jumelages du serveur, puis désinstaller"
    yes: "Ne pas demander de confirmation"

