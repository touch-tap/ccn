# Turkish. "Siz" throughout, as the phone app and the push copy. Terminology follows the app:
# eşleme/eşlemek (pair), lisans (licence), lisans anahtarı (licence key), kilidini açmak / kilidi
# açık (unlock/unlocked), bilgisayar, telefon, onaylar, bildirimler, terminal. `hook` stays as the
# developers' word (it is the settings.json section name).
_version: 1

cli:
  about: "Claude Code Notifier: Claude Code size ihtiyaç duyduğunda telefonunuza bildirim alın ve oradan yanıtlayın"
  pair:
    about: "Bu bilgisayarı telefonunuzla eşleyin. Uygulamanın gösterdiği kodu verin ya da kod olmadan çalıştırıp uygulamaya yazacağınız bir kod alın"
    code: "Claude Code Notifier uygulamasında gösterilen 6 haneli kod"
    name: "Bu bilgisayarın telefonunuzda görünen adı (varsayılan: ana makine adı)"
    replace_mac_app: "Bildirimler iki kez gönderilmesin diye Mac menü çubuğu uygulamasının hook girdilerini de kaldır"
    no_wait: "QR kodunu gösterip hemen çık: telefon bağlandığında eşleme kendiliğinden tamamlanır"
  setup:
    about: "Claude Code hook'larını ve masaüstü bildirimlerini kur (pair ve tek başına ccn bunu önce yapar)"
    replace_mac_app: "Mac menü çubuğu uygulamasının hook girdilerini de kaldır"
  doctor:
    about: "Hook'ları, kimlik bilgilerini, sunucuyu ve bu terminalin neleri desteklediğini denetle"
  test:
    about: "Eşlenmiş her telefona bir deneme bildirimi gönder"
  devices:
    about: "Eşlenmiş telefonları listele ya da birinin eşlemesini kaldır"
    revoke: "Bir telefonun eşlemesini adına veya kimliğine göre kaldır"
  config:
    about: "Bu bilgisayarın ayarlarını göster veya değiştir (telefondan da düzenlenebilir)"
    show: "Geçerli ayarları yazdır"
    set: "Tek bir ayarı değiştir, örn. `ccn config set hold_ceiling_seconds 300` veya `ccn config set quiet_hours 22:00-08:00`"
  sync:
    about: "En güncel ayarları sunucudan şimdi çek"
  unlock:
    about: "Bu bilgisayar için tarayıcıda bir lisans satın al: onunla eşlenen her telefonun kilidini açar"
    lifetime: "Yıllık yerine tek seferlik öde (ya da yıllık lisansı anahtarı koruyarak ömür boyuna çevir)"
  upgrade:
    about: "ccn'i en son sürüme güncelle (arka planda günde bir kez de denetlenir)"
    check: "Yalnızca daha yeni bir sürüm var mı söyle: güncelse 0, yeni sürüm varsa 10 koduyla çık"
    quiet: "Bir şey ters gitmedikçe hiçbir şey yazdırma"
  activate:
    about: "Bu bilgisayarda bir lisans anahtarı kullan (lisans başına en fazla 3 bilgisayar)"
    key: "E-postanızdaki anahtar, CCN-XXXX-XXXX-XXXX-XXXX"
    replace: "Buna yer açmak için lisanstaki başka bir bilgisayarın yerini adıyla boşalt"
  deactivate:
    about: "Anahtar başka yerde kullanılabilsin diye bu bilgisayarın lisans yerini boşalt"
  licence:
    about: "Bu bilgisayarın lisansını ve onu kullanan bilgisayarları göster"
  uninstall:
    about: "Hook'ları, kimlik bilgilerini, eşlemeleri ve yerel durumu kaldır"
  forget:
    about: "Bu bilgisayarı ve eşlemelerini sunucudan sil, sonra kaldır"
    yes: "Onay isteme"

