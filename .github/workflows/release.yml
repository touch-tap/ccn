name: Release

# Push a tag like v0.2.0. Builds every target and attaches them to a DRAFT release; a person
# publishes it. The install scripts, Homebrew formula and npm packages all read these assets.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,       os: macos-latest,   tool: cargo }
          - { target: x86_64-apple-darwin,        os: macos-latest,   tool: cargo }
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,  tool: zigbuild }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest,  tool: zigbuild }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest, tool: cargo }
          - { target: aarch64-pc-windows-msvc,    os: windows-latest, tool: cargo }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install zig and cargo-zigbuild
        if: matrix.tool == 'zigbuild'
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.tool }}" = zigbuild ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = Windows ]; then
            7z a ../../../dist/ccn-${{ matrix.target }}.zip ccn.exe
          else
            tar czf ../../../dist/ccn-${{ matrix.target }}.tar.gz ccn
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ccn-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Homebrew formula
        run: scripts/brew-formula.sh "${GITHUB_REF_NAME#v}" dist/SHA256SUMS > dist/ccn.rb
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --title "ccn $GITHUB_REF_NAME" --generate-notes
