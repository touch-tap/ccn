[package]
name = "ccn"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store", "zbus-secret-service-keyring-store", "windows-native-keyring-store"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.1.8"
ureq = { version = "3.5.0", features = ["json"] }
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
